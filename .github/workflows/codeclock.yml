name: CodeClock refresh

# Refreshes your CodeClock charts once a day, shortly after 02:00 (Europe/Berlin).
# GitHub cron runs on UTC and often starts late, so two schedules cover summer and winter time.
# A run does the work only if it is past 02:00 Europe/Berlin and today's refresh has not happened yet.
# The other runs finish in seconds and do nothing, that is normal.
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if a refresh is due
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          today=$(TZ=Europe/Berlin date +%Y%m%d)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$((10#$hour))" -lt "$((10#02))" ] || grep -q "&v=$today" README.md; }; then
            echo "Nothing to do now (hour $hour, already refreshed or too early)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake the API and warm the charts
        if: steps.gate.outputs.run == 'true'
        run: |
          grep -oE 'https://[^"]*/card/[a-z]+\.svg[^"#]*' README.md | sort -u | while read -r url; do
            curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 -o /dev/null "$url"
          done

      - name: Bump cache buster so GitHub refetches the images
        if: steps.gate.outputs.run == 'true'
        run: |
          today=$(TZ=Europe/Berlin date +%Y%m%d)
          sed -i -E "s/(\/card\/[a-z]+\.svg[^\"#]*&v=)[0-9]{8}/\1${today}/g" README.md

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "codeclock-bot"
          git config user.email "codeclock-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Refresh CodeClock stats" && git push)

      - name: Sync stats to portfolio
        if: steps.gate.outputs.run == 'true'
        env:
          PORTFOLIO_STATS_API_URL: ${{ secrets.PORTFOLIO_STATS_API_URL }}
          STATS_SYNC_SECRET: ${{ secrets.STATS_SYNC_SECRET }}
          CODECLOCK_STATS_URL: https://devtime-api-rxc1.onrender.com/public/Cpj_4qjYjRcWj2hkQmueSBCECZk-5zKA/portfolio.json?tz=Europe/Berlin
        run: node scripts/push-stats-to-portfolio.mjs
